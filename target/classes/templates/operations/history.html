
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Historique des opérations</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #3498db;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --light-bg: #f8f9fa;
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }

    .account-header {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .account-number {
      color: var(--primary-color);
      font-weight: 600;
    }

    .balance-display {
      font-size: 1.2rem;
      background-color: #f8f9fa;
      padding: 10px 15px;
      border-radius: 5px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .operation-table {
      margin: 30px 0;
    }

    .operation-table th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 500;
    }

    .operation-table tr:hover {
      background-color: rgba(52, 152, 219, 0.05);
    }

    .deposit-row {
      border-left: 4px solid var(--success-color);
    }

    .withdrawal-row {
      border-left: 4px solid var(--danger-color);
    }

    .action-buttons {
      margin-top: 30px;
    }

    .btn-deposit {
      background-color: var(--success-color);
      border: none;
    }

    .btn-withdraw {
      background-color: var(--danger-color);
      border: none;
    }

    .btn-back {
      background-color: #6c757d;
      border: none;
    }

    .alert-custom {
      border-radius: 5px;
      padding: 12px 15px;
    }
  </style>
</head>
<body>
<div class="main-container">
  <div class="account-header">
    <h2><i class="bi bi-journal-text"></i> Historique des opérations</h2>
    <h4 class="account-number" th:text="'Compte n° ' + ${account.accountNumber}"></h4>
  </div>

  <div class="balance-display">
    <i class="bi bi-wallet2"></i> Solde actuel:
    <strong th:text="${account.balance} + ' €'"></strong>
  </div>

  <!-- Messages d'alerte -->
  <div th:if="${success}" class="alert alert-success alert-custom" role="alert">
    <i class="bi bi-check-circle-fill"></i>
    <span th:text="${success}"></span>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-custom" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span th:text="${error}"></span>
  </div>

  <!-- Tableau des opérations -->
  <div class="table-responsive">
    <table class="table table-hover operation-table">
      <thead>
      <tr>
        <th><i class="bi bi-tag"></i> Type</th>
        <th><i class="bi bi-cash-stack"></i> Montant</th>
        <th><i class="bi bi-calendar"></i> Date</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="op : ${operations}"
          th:class="${op.operationType == 'DEPOT' ? 'deposit-row' : 'withdrawal-row'}">
        <td>
            <span th:if="${op.operationType == 'DEPOT'}" class="badge bg-success">
              <i class="bi bi-arrow-down-circle"></i> Dépôt
            </span>
          <span th:if="${op.operationType == 'RETRAIT'}" class="badge bg-danger">
              <i class="bi bi-arrow-up-circle"></i> Retrait
            </span>
        </td>
        <td th:text="${op.amount} + ' €'"></td>
        <td th:text="${#temporals.format(op.date, 'dd/MM/yyyy HH:mm')}"></td>
      </tr>
      <tr th:if="${operations.empty}">
        <td colspan="3" class="text-center text-muted py-4">
          <i class="bi bi-info-circle"></i> Aucune opération enregistrée
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Boutons d'action -->
  <div class="action-buttons d-flex justify-content-between">
    <div>
      <a th:href="@{/operations/deposit(accountId=${account.id})}"
         class="btn btn-primary btn-deposit text-white me-2">
        <i class="bi bi-plus-circle"></i> Nouveau dépôt
      </a>
      <a th:href="@{/operations/withdraw(accountId=${account.id})}"
         class="btn btn-primary btn-withdraw text-white me-2">
        <i class="bi bi-dash-circle"></i> Nouveau retrait
      </a>
    </div>
    <a th:href="@{/accounts(id=${account.client.id})}"
       class="btn btn-secondary btn-back text-white">
      <i class="bi bi-arrow-left"></i> Retour aux comptes
    </a>
  </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
