

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dépôt bancaire</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .deposit-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .form-header {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }
    .account-number {
      font-weight: bold;
      color: #3498db;
    }
    .form-label {
      font-weight: 500;
      margin-bottom: 8px;
    }
    .btn-deposit {
      background-color: #3498db;
      border: none;
      padding: 10px 25px;
      font-weight: 500;
    }
    .btn-deposit:hover {
      background-color: #2980b9;
    }
    .btn-cancel {
      color: #3498db;
      border: 1px solid #3498db;
    }
    .btn-cancel:hover {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="deposit-container">
    <h2 class="form-header">Effectuer un dépôt</h2>

    <div class="mb-4">
      <p class="mb-1">Compte n°: <span class="account-number" th:text="${account.accountNumber}"></span></p>
      <p>Solde actuel: <span th:text="${account.balance} + ' €'"></span></p>
    </div>

    <form th:action="@{/operations/deposit}" method="post">
      <!-- Champ caché pour l'accountId -->
      <input type="hidden" name="accountId" th:value="${account.id}">

      <div class="mb-4">
        <label for="amount" class="form-label">Montant à déposer (€)</label>
        <div class="input-group">
          <span class="input-group-text">€</span>
          <input type="number"
                 class="form-control"
                 id="amount"
                 name="amount"
                 step="0.01"
                 min="0.01"
                 required
                 placeholder="Entrez le montant">
        </div>
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary btn-deposit">
          <i class="bi bi-arrow-down-circle"></i> Confirmer le dépôt
        </button>

        <a th:href="@{'/operations/history?accountId=' + ${account.id}}"
           class="btn btn-outline-primary btn-cancel">
          <i class="bi bi-x-circle"></i> Annuler
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
