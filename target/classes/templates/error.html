<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 5px;
            background-color: #f8f9fa;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .error-details {
            background-color: #fff;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-container">
        <h1 class="text-danger">❌ Une erreur est survenue</h1>

        <div class="alert alert-danger" th:if="${error}">
            <h4 th:text="${error}">Message d'erreur</h4>
        </div>

        <div class="error-details" th:unless="${error}">
            <p>Désolé, une erreur inattendue s'est produite.</p>
            <p>Veuillez réessayer plus tard ou contacter l'administrateur.</p>
        </div>

        <div th:if="${timestamp}" class="mt-3 text-muted small">
            <p>Date/heure: <span th:text="${timestamp}"></span></p>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">Retour à l'accueil</a>
<!--            <a href="/accounts" class="btn btn-outline-secondary ms-2">Retour aux comptes</a>-->
        </div>

        <!-- Section debug (à masquer en production) -->
        <div th:if="${#strings.isEmpty(error)} and ${trace}" class="mt-4 small text-muted">
            <details>
                <summary>Détails techniques</summary>
                <pre th:text="${trace}"></pre>
            </details>
        </div>
    </div>
</div>
</body>
</html>
