<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${client.id} ? 'Edit Client' : 'New Client'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --dark-color: #2b2d42;
      --light-color: #f8f9fa;
    }

    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2rem;
      margin-top: 2rem;
    }

    .form-header {
      color: var(--dark-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      border: none;
      padding: 0.5rem 1.5rem;
    }

    .btn-primary-custom:hover {
      background-color: var(--secondary-color);
    }

    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
    }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-container">
        <h2 class="form-header">
          <i class="fas" th:class="${client.id} ? 'fa-user-edit' : 'fa-user-plus'"></i>
          <span th:text="${client.id} ? ' Edit Client' : ' New Client'"></span>
        </h2>

        <form th:action="@{/clients/save}" th:object="${client}" method="post">
          <input type="hidden" th:field="*{id}"/>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" th:field="*{firstName}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" th:field="*{lastName}" required>
            </div>

            <div class="col-12">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" th:field="*{email}" required>
            </div>

<!--            <div class="col-md-6">-->
<!--              <label class="form-label">Phone</label>-->
<!--              <input type="tel" class="form-control" th:field="*{phone}" pattern="[0-9]{10}">-->
<!--            </div>-->
            <div class="mb-3">
              <label class="form-label">Téléphone</label>
              <input type="tel" class="form-control" th:field="*{phone}"
                     pattern="[0-9\s\+]{10,15}"
                     title="Format : 10 chiffres (espaces ou + autorisés)"
                     placeholder="Ex: 06 12 34 56 78 ou +33612345678">
            </div>

            <div class="col-md-6">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" th:field="*{address}">
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-primary-custom me-2">
                <i class="fas fa-save"></i> Save
              </button>
              <a th:href="@{/clients}" class="btn btn-outline-secondary">
                <i class="fas fa-times"></i> Cancel
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
