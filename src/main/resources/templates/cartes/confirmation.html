<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de carte</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .confirmation-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #4CAF50;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
        }
        .success-icon {
            color: #4CAF50;
            font-size: 48px;
            margin-bottom: 15px;
        }
        .account-details {
            text-align: left;
            margin: 25px 0;
            padding: 0;
        }
        .account-details p {
            margin: 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .account-details strong {
            color: #555;
            font-weight: 600;
        }
        .account-details span {
            color: #2c3e50;
            font-weight: 500;
        }
        .button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .button:hover {
            background-color: #3e8e41;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="confirmation-box">
    <div class="success-icon">✓</div>
    <h2>Carte créé avec succès</h2>

    <div class="account-details">
        <p>
            <strong>Numéro de compte :</strong>
            <span th:text="${carte.accountNumber}">100000001</span>
        </p>
        <p>
        <strong>Numéro de carte :</strong>
        <span th:text="${carte.carteNumber}">100000001</span>
        </p>
        <p>
            <strong>Type:</strong>
            <span th:text="${carte.type}">VOYAGE</span>
        </p>
        <p>

    </div>

    <a href="/clients" class="button">Retour à la liste des cartes</a>
</div>
</body>
</html>
