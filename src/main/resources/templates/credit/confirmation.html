<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de demande</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">
                <i class="bi bi-check-circle"></i> Demande enregistrée
            </h3>
        </div>
        <div class="card-body">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <h4>Récapitulatif de votre demande</h4>
            <div class="row mt-4">
                <div class="col-md-6">
                    <p><strong>Référence:</strong> <span th:text="${credit.id}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${credit.email}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Compte:</strong> <span th:text="${credit.accountNumber}"></span></p>
                    <p><strong>Salaire:</strong> <span th:text="${credit.salary} + ' €'"></span></p>
                </div>
            </div>

            <div class="alert alert-info mt-4">
                <i class="bi bi-info-circle"></i>
                Votre demande est en cours de traitement. Vous recevrez une réponse par email.
            </div>

            <a href="/clients" class="btn btn-primary">
                <i class="bi bi-house"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</body>
</html>
