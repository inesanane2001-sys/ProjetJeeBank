
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Register - MyBank</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/css/style.css}">
	<link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>

<div class="container">
	<div class="form-container">
		<h2 class="text-center">📝 Register at MyBank</h2>

		<!-- Affichage du message de succès -->
		<div th:if="${param.success}" class="alert alert-success text-center">
			Registration successful! You can now <a href="/login">log in</a>.
		</div>

		<!-- Affichage du message d'erreur -->
		<div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

		<form th:action="@{/registration}" method="post" th:object="${user}" enctype="multipart/form-data">
			<div class="mb-3">
				<label for="firstName" class="form-label">First Name</label>
				<input id="firstName" class="form-control" th:field="*{firstName}" required>
			</div>

			<div class="mb-3">
				<label for="lastName" class="form-label">Last Name</label>
				<input id="lastName" class="form-control" th:field="*{lastName}" required>
			</div>

			<div class="mb-3">
				<label for="email" class="form-label">Email</label>
				<input id="email" class="form-control" th:field="*{email}" required>
			</div>

			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input id="password" class="form-control" type="password" th:field="*{password}" required>
			</div>

			<div class="mb-3">
				<label for="profilePicture" class="form-label">Profile Picture</label>
				<input type="file" class="form-control" id="profilePicture" th:field="*{profilePicture}" accept="image/*">
			</div>

			<button type="submit" class="btn btn-custom w-100">Register</button>
		</form>

		<p class="text-center mt-3">
			Already have an account? <a href="/login">Login here</a>
		</p>
	</div>
</div>

</body>
</html>
