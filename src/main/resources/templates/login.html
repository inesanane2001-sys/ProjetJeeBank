<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Login - MyBank</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/css/style.css}">
</head>
<body>

<div class="container">
	<div class="form-container">
		<h2 class="text-center">🔐 Login to MyBank</h2>

		<!-- Show error message if login failed -->
		<div th:if="${param.error}" class="alert alert-danger text-center">
			Invalid email or password. Please try again.
		</div>

		<!-- Show logout success message -->
		<div th:if="${param.logout}" class="alert alert-success text-center">
			You have been logged out successfully.
		</div>

		<form th:action="@{/login}" method="post">
			<div class="mb-3">
				<label for="email" class="form-label">Email</label>
				<input id="email" class="form-control" name="username" required>
			</div>

			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input id="password" class="form-control" type="password" name="password" required>
			</div>

			<button type="submit" class="btn btn-custom w-100">Login</button>
		</form>

		<p class="text-center mt-3">
			Don't have an account? <a href="/registration">Register here</a>
		</p>
	</div>
</div>

</body>
</html>
